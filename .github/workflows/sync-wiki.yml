name: Sync Readme to Wiki

on:
  push:
    branches:
      - main 
    paths:
      - 'readme.md'

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Sync readme.md to wiki Home.md
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${REPO}.wiki.git" wiki-repo
          cp readme.md wiki-repo/Home.md
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Home.md
          if git diff --staged --quiet; then
            echo "No changes to sync. Home.md is already up to date."
            exit 0
          fi
          git commit -m "chore: automated sync of readme.md to wiki Home.md"
          git push
